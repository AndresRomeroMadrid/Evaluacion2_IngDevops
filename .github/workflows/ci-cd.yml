name: Pipeline CI/CD - Microservicios DevOps

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  unit-tests:
    name: Pruebas Unitarias y Cobertura (Jest & PyTest)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            microservicio-creacion/package-lock.json

      - name: Configurar Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: microservicio-actualizacion/requirements-dev.txt

      # Pruebas Microservicio 1 (Node.js - Jest)
      - name: Instalar dependencias (Microservicio 1 - Creación Node.js)
        run: |
          cd microservicio-creacion
          npm ci

      - name: Ejecutar pruebas unitarias (Microservicio 1 - Jest)
        run: |
          cd microservicio-creacion
          npm test

      # Pruebas Microservicio 2 (Python - PyTest)
      - name: Instalar dependencias (Microservicio 2 - Actualización Python)
        run: |
          cd microservicio-actualizacion
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas unitarias (Microservicio 2 - PyTest)
        run: |
          cd microservicio-actualizacion
          pytest --cov=src --cov-report=term-missing --cov-report=html:coverage

      - name: Publicar artefactos de cobertura
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reportes-cobertura
          path: |
            microservicio-creacion/coverage/
            microservicio-actualizacion/coverage/
          retention-days: 14

  
  security-analysis:
    name: Escaneo de Seguridad y Bloqueo (SAST / SCA)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Auditoría de dependencias con npm audit
      - name: Escaneo SCA con npm audit (Microservicio Creación)
        run: |
          cd microservicio-creacion
          echo "Auditando Microservicio de Creación (Node.js)..."
          npm audit --audit-level=high

      - name: Escaneo SCA con npm audit (Frontend)
        run: |
          cd frontend
          npm audit --audit-level=high

      # Análisis de Vulnerabilidades con Aqua Security Trivy
      - name: Análisis de Vulnerabilidades con Aqua Security Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # Control de Quality Gate: bloqueo y alerta si se viola la seguridad
      - name: Verificación de Quality Gate y Reglas de Bloqueo
        if: failure()
        run: |
          echo "::error title=BLOQUEO DE SEGURIDAD::El pipeline ha detectado vulnerabilidades críticas o fallas en el análisis estático."
          echo "=========================================================================="
          echo " ALERTA DE GOBERNANZA DEVOPS (IE3)"
          echo "Se ha detenido el avance a la etapa de construcción y despliegue."
          echo "Revise los registros de dependencias y solucione las vulnerabilidades."
          echo "=========================================================================="
          exit 1

  docker-build:
    name:  Construcción y Publicación de Imágenes Docker
    runs-on: ubuntu-latest
    needs: [unit-tests, security-analysis]
    env:
      IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}
      # Solo se publica desde main/master (nunca en PR, donde no hay secrets)
      PUBLICAR: ${{ github.event_name != 'pull_request' && contains(fromJSON('["main","master"]'), github.ref_name) }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir Imagen Microservicio 1 (Node Alpine Multi-Stage)
        uses: docker/build-push-action@v5
        with:
          context: ./microservicio-creacion
          file: ./microservicio-creacion/Dockerfile
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/microservicio-creacion:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/microservicio-creacion:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir Imagen Microservicio 2 (Python Debian Slim Hardened)
        uses: docker/build-push-action@v5
        with:
          context: ./microservicio-actualizacion
          file: ./microservicio-actualizacion/Dockerfile
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/microservicio-actualizacion:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/microservicio-actualizacion:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir Imagen Frontend Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend-dashboard:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend-dashboard:latest

  
  deploy-simulation:
    name:  Despliegue Simulado (Docker Compose) y Trazabilidad
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name:  Clonar repositorio
        uses: actions/checkout@v4

      - name:  Crear archivo .env desde .env.example
        run: cp .env.example .env

      - name: Orquestar y Desplegar Contenedores con Docker Compose
        run: |
          echo "Iniciando despliegue en entorno simulado con Docker Compose..."
          docker compose -f docker-compose.yml up -d --build

      - name: Esperar estabilización y Healthcheck de Contenedores
        run: |
          echo "Verificando estado de contenedores en ejecución..."
          sleep 12
          docker compose ps
          docker compose logs

      - name:  Ejecución de Smoke Tests (Pruebas de Humo en Despliegue)
        run: |
          echo "Realizando pruebas de disponibilidad de endpoints..."
          
          # Health check Microservicio 1 (Node.js)
          curl --fail --retry 5 --retry-delay 3 http://localhost:3001/health || exit 1
          echo " Microservicio 1 (Creación - Node.js) respondiendo OK"

          # Health check Microservicio 2 (Python)
          curl --fail --retry 5 --retry-delay 3 http://localhost:3002/health || exit 1
          echo " Microservicio 2 (Actualización - Python) respondiendo OK"

          # Health check Frontend
          curl --fail --retry 5 --retry-delay 3 http://localhost:3000/health || exit 1
          echo " Frontend Dashboard respondiendo OK"

          # Prueba funcional de consulta de productos
          PRODS=$(curl -s http://localhost:3001/api/productos)
          echo "Productos obtenidos en despliegue: $PRODS"

      - name: Generar Registro Oficial de Trazabilidad (Audit Trail)
        run: |
          mkdir -p .trazabilidad
          FECHA=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > .trazabilidad/despliegue_${{ github.sha }}.json
          {
            "evento": "${{ github.event_name }}",
            "commit_sha": "${{ github.sha }}",
            "rama": "${{ github.ref_name }}",
            "autor": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "fecha_utc": "$FECHA",
            "entorno": "Simulado Cloud (Docker Compose CI)",
            "estado": "DESPLIEGUE_EXITOSO",
            "servicios": [
              { "nombre": "service-create", "lenguaje": "Node.js", "puerto": 3001, "imagen": "microservicio-creacion:${{ github.sha }}" },
              { "nombre": "service-update", "lenguaje": "Python", "puerto": 3002, "imagen": "microservicio-actualizacion:${{ github.sha }}" },
              { "nombre": "frontend", "lenguaje": "Node.js", "puerto": 3000, "imagen": "frontend-dashboard:${{ github.sha }}" }
            ]
          }
          EOF
          echo "Registro de trazabilidad generado:"
          cat .trazabilidad/despliegue_${{ github.sha }}.json

      - name: Almacenar Registro de Trazabilidad como Artefacto
        uses: actions/upload-artifact@v7
        with:
          name: trazabilidad-despliegue
          path: .trazabilidad/

      - name:  Detención controlada del entorno simulado
        if: always()
        run: |
          docker compose -f docker-compose.yml down
          echo "Entorno simulado desmontado limpiamente."

  deploy-ec2:
    name:  Despliegue en AWS EC2 (SSM)
    runs-on: ubuntu-latest
    needs: [docker-build, deploy-simulation]
    if: github.event_name != 'pull_request' && contains(fromJSON('["main","master"]'), github.ref_name)
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_SECRET_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Preparar script de despliegue
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # El .env de producción usa las imágenes publicadas para este commit
          sed -e "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}|" \
              -e "s|^IMAGE_TAG=.*|IMAGE_TAG=${GITHUB_SHA}|" .env.example > deploy.env
          {
            echo "COMPOSE_B64=$(base64 -w0 docker-compose.yml)"
            echo "ENV_B64=$(base64 -w0 deploy.env)"
            cat .github/scripts/deploy-ec2.sh
          } > deploy.sh
          jq -n --rawfile script deploy.sh '{commands: ($script | split("\n"))}' > ssm-params.json

      - name: Desplegar en la EC2 mediante SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Despliegue ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "Comando SSM: $COMMAND_ID"

          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "Estado final: $STATUS"
          echo "---------- STDOUT ----------"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "---------- STDERR ----------"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error title=DESPLIEGUE FALLIDO::El comando SSM terminó con estado $STATUS"
            exit 1
          fi
