# ==============================================================================
# ORQUESTACIÓN CON DOCKER COMPOSE (IE5 & IE3)
# ==============================================================================
# Orquesta la solución completa de microservicios:
#   1. service-create: Microservicio 1 (Catálogo e inserción de Mouse, Teclado, Monitor)
#   2. service-update: Microservicio 2 (Actualización de precios/datos y auditoría)
#   3. frontend: Dashboard web interactivo para operaciones CRUD
#
# Características de Gobernanza y Rendimiento (IE3):
#   - Límites de recursos (CPU y Memoria) definidos por contenedor.
#   - Red aislada tipo bridge (devops-network).
#   - Políticas de reinicio y healthchecks síncronos con depends_on condicional.
#   - Configuración externalizada: todas las variables se leen del archivo .env
#     (ver .env.example); si falta alguna, `docker compose` aborta con un error.
# ==============================================================================

services:
  # Microservicio 1: Creación y Consulta de Productos (Node.js Alpine Multi-stage)
  service-create:
    build:
      context: ./microservicio-creacion
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:?Definir DOCKERHUB_USERNAME en .env}/microservicio-creacion:${IMAGE_TAG:-latest}
    container_name: microservicio-creacion-app
    restart: unless-stopped
    ports:
      - "${CREATE_PORT:?Definir CREATE_PORT en .env}:${CREATE_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV:?Definir NODE_ENV en .env}
      - PORT=${CREATE_PORT}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + process.env.PORT + '/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - devops-network

  # Microservicio 2: Actualización y Reglas de Negocio (Python 3.12 Debian Slim)
  service-update:
    build:
      context: ./microservicio-actualizacion
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:?Definir DOCKERHUB_USERNAME en .env}/microservicio-actualizacion:${IMAGE_TAG:-latest}
    container_name: microservicio-actualizacion-app
    restart: unless-stopped
    ports:
      - "${UPDATE_PORT:?Definir UPDATE_PORT en .env}:${UPDATE_PORT}"
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:?Definir PYTHONUNBUFFERED en .env}
      - PORT=${UPDATE_PORT}
      - CREATE_SERVICE_URL=${CREATE_SERVICE_URL:?Definir CREATE_SERVICE_URL en .env}
    depends_on:
      service-create:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - devops-network

  # Frontend Dashboard Web (Node.js Express BFF)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:?Definir DOCKERHUB_USERNAME en .env}/frontend-dashboard:${IMAGE_TAG:-latest}
    container_name: frontend-dashboard-app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:?Definir FRONTEND_PORT en .env}:${FRONTEND_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${FRONTEND_PORT}
      - CREATE_SERVICE_URL=${CREATE_SERVICE_URL}
      - UPDATE_SERVICE_URL=${UPDATE_SERVICE_URL:?Definir UPDATE_SERVICE_URL en .env}
    depends_on:
      service-create:
        condition: service_healthy
      service-update:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - devops-network

# Red interna aislada para la comunicación entre microservicios
networks:
  devops-network:
    driver: bridge
    name: devops-microservicios-net
